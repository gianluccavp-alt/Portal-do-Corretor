<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empreendimento · Portal do Corretor</title>
<link rel="icon" type="image/webp" href="assets/img/favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div id="app"><!-- montado por JS --></div>

<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script>
(function () {
  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  var empId = qs('e');
  var emp = empId ? window.findEmpreendimento(empId) : null;
  var app = document.getElementById('app');

  if (!emp) {
    app.innerHTML = '<div style="max-width:600px;margin:6rem auto;text-align:center;padding:2rem">' +
      '<h1 style="font-family:Playfair Display,serif;font-size:2rem;margin-bottom:1rem">Empreendimento não encontrado</h1>' +
      '<p style="color:var(--muted);margin-bottom:2rem">O link acessado não corresponde a nenhum empreendimento cadastrado.</p>' +
      '<a href="index.html" style="color:var(--gold)">&larr; Voltar para a página inicial</a></div>';
    return;
  }
  window.CURRENT_EMP = emp;
  document.title = emp.nome + ' · Portal do Corretor';

  /* paleta por empreendimento (escopo: esta pagina) */
  var THEMES = {
    // Seleto = vinho + terracota do logo
    'seleto':
      ':root{--gold:#BE6A3B;--gold-light:#D08C5E;--dark:#5F2B37;--green:#8A3E4C;--green-light:#F5EAEC;}' +
      '.stag{background:rgba(190,106,59,.10);border-color:rgba(190,106,59,.30)}' +
      '.u-desc{border-color:#E3C9CE}',
    // Casa Prado = verde oliva + dourado do mapa de vagas
    'casa-prado':
      ':root{--gold:#B4923F;--gold-light:#CDA85C;--dark:#3E4736;--green:#4F5A45;--green-light:#EBEEE4;}' +
      '.stag{background:rgba(180,146,63,.12);border-color:rgba(180,146,63,.30)}' +
      '.u-desc{border-color:#D7DCC9}',
    // Ipiranga = azul + dourado + vermelho do logo Conquista
    'ipiranga':
      ':root{--gold:#1E86C4;--gold-light:#55AFE4;--dark:#0F4C6B;--green:#B4890A;--green-light:#FBF3D2;}' +
      '.hero-eyebrow::before{background:#CB0935}' +
      '.stag{background:rgba(30,134,196,.10);border-color:rgba(30,134,196,.30)}' +
      '.u-desc{border-color:#CFE6F5}',
    // Village Park = verde pistache + verde novus + ocre novus
    'village-park':
      ':root{--gold:#B79332;--gold-light:#8FA658;--dark:#394A20;--green:#4F6B2E;--green-light:#EAF1DD;}' +
      '.stag{background:rgba(124,147,69,.12);border-color:rgba(124,147,69,.30)}' +
      '.u-desc{border-color:#D8E2C6}',
    // Village Gaia = coral + teal escuro do logo
    'village-gaia':
      ':root{--gold:#D8695D;--gold-light:#F28B82;--dark:#2C4444;--green:#3A5A56;--green-light:#E5EFEC;}' +
      '.stag{background:rgba(242,139,130,.14);border-color:rgba(242,139,130,.35)}' +
      '.u-desc{border-color:#F3D4CF}',
    // Jardim Botanico = verde escuro do logo (paleta monocromatica)
    'jardim-botanico':
      ':root{--gold:#5E6B54;--gold-light:#A9B89F;--dark:#3F473D;--green:#4A5842;--green-light:#E9EDE5;}' +
      '.stag{background:rgba(63,71,61,.10);border-color:rgba(63,71,61,.28)}' +
      '.u-desc{border-color:#D5DBCD}'
  };
  if (emp.theme && THEMES[emp.theme]) {
    var _themeEl = document.createElement('style');
    _themeEl.textContent = THEMES[emp.theme];
    document.head.appendChild(_themeEl);
  }

  /* ---------- helpers de HTML ---------- */
  function heroStyle() {
    if (!emp.heroImg) return "";
    var s = "background-image:url('" + emp.heroImg + "')";
    if (emp.heroBlur) s += ";filter:brightness(0.42) blur(3px);transform:scale(1.05)";
    return s;
  }
  var PROX_ICONS = {
    shopping: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>',
    lake: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s6 5.4 6 10.3a6 6 0 0 1-12 0c0-4.9 6-10.3 6-10.3z"></path></svg>',
    road: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22 8 2"></path><path d="M20 22 16 2"></path><line x1="12" y1="6" x2="12" y2="8"></line><line x1="12" y1="12" x2="12" y2="14"></line><line x1="12" y1="18" x2="12" y2="20"></line></svg>',
    school: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"></path><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"></path></svg>',
    hospital: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>'
  };
  function proximidadesHtml() {
    if (!emp.proximidades || !emp.proximidades.length) return '';
    return '<div class="prox"><span class="prox-lbl">Próximo à:</span><div class="prox-items">' +
      emp.proximidades.map(function (p) {
        return '<div class="prox-item"><span class="prox-ic">' + (PROX_ICONS[p.icon] || '') + '</span>' +
          '<span class="prox-name">' + p.label + '</span></div>';
      }).join('') + '</div></div>';
  }
  function badgesHtml() {
    if (!emp.badges || !emp.badges.length) return '';
    return '<div class="hero-loc">' + emp.badges.map(function (b) {
      return '<div class="loc-badge"><span class="loc-dot"></span>' + b + '</div>';
    }).join('') + '</div>';
  }
  function pillsHtml() {
    if (!emp.pills || !emp.pills.length) return '';
    return '<div class="pills">' + emp.pills.map(function (p) {
      return '<div class="pill"><div class="pill-num">' + p.num + '</div><div class="pill-lbl">' + p.lbl + '</div></div>';
    }).join('') + '</div>';
  }
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  var CHEV_SVG = '<svg class="fdd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
  var TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';

  function ddOpt(label, active, onclick) {
    return '<button class="fdd-opt' + (active ? ' on' : '') + '" onclick="' + onclick + '"><span>' + label + '</span>' + CHECK_SVG + '</button>';
  }

  function dropdown(lbl, valId, panelHtml) {
    return '<div class="fdd">' +
      '<button class="fdd-btn" type="button"><span class="fdd-lbl">' + lbl + '</span>' +
      '<span class="fdd-val" id="' + valId + '">Todos</span>' + CHEV_SVG + '</button>' +
      '<div class="fdd-panel">' + panelHtml + '</div>' +
    '</div>';
  }

  function torresList() {
    if (emp.torresVisiveis && emp.torresVisiveis.length) return emp.torresVisiveis;
    var n = emp.torres || 1, list = [];
    for (var t = 1; t <= n; t++) list.push(t);
    return list;
  }
  function torreOptsHtml() {
    var list = torresList(), h = '';
    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      h += ddOpt('Torre ' + t, false, "setTorre('" + t + "',this)").replace('class="fdd-opt', 'id="torre-opt-' + t + '" class="fdd-opt');
    }
    return h;
  }
  function torreDropdownHtml() {
    if (torresList().length < 2) return '';
    var opts = ddOpt('Todas', true, "setTorre('todos',this)").replace('class="fdd-opt', 'id="torre-opt-todos" class="fdd-opt') +
      torreOptsHtml() +
      '<button class="fdd-clear" onclick="clearTorre()"><span>Limpar filtros</span>' + TRASH_SVG + '</button>';
    return dropdown('Torre', 'torre-val', opts).replace('id="torre-val">Todos', 'id="torre-val">Todas');
  }

  // opcoes do filtro Tipo: usa emp.tipos quando definido (ex.: Seleto), senao o padrao
  function tipoDropdownHtml() {
    var opts = ddOpt('Todos', true, "setFilter('todos',this)").replace('class="fdd-opt', 'id="tipo-opt-todos" class="fdd-opt');
    var list = (emp.tipos && emp.tipos.length) ? emp.tipos : [
      { key: '2q-meio', label: '2Q C/S Meio' },
      { key: '2q-ponta', label: '2Q C/S Ponta' },
      { key: 'terreo-meio', label: 'Terreo Meio' },
      { key: 'terreo-ponta', label: 'Terreo Ponta' },
      { key: '1q', label: 'Studio 1Q' }
    ];
    list.forEach(function (t) {
      opts += ddOpt(t.label, false, "setFilter('" + t.key + "',this)").replace('class="fdd-opt', 'id="tipo-opt-' + t.key + '" class="fdd-opt');
    });
    opts += '<button class="fdd-clear" onclick="clearTipo()"><span>Limpar filtros</span>' + TRASH_SVG + '</button>';
    return dropdown('Tipo', 'tipo-val', opts);
  }

  function solDropdownHtml() {
    var opts = ddOpt('Todos', true, "setSol('todos',this)").replace('class="fdd-opt', 'id="sol-opt-todos" class="fdd-opt') +
      ddOpt('&#9728; Nascente', false, "setSol('nascente',this)").replace('class="fdd-opt', 'id="sol-opt-nascente" class="fdd-opt') +
      ddOpt('&#9790; Poente', false, "setSol('poente',this)").replace('class="fdd-opt', 'id="sol-opt-poente" class="fdd-opt') +
      '<button class="fdd-clear" onclick="clearSol()"><span>Limpar filtros</span>' + TRASH_SVG + '</button>';
    return dropdown('Sol', 'sol-val', opts);
  }

  function premioDropdownHtml() {
    var opts = ddOpt('Com Prêmio', true, "setPremio('com',this)").replace('class="fdd-opt', 'id="premio-opt-com" class="fdd-opt') +
      ddOpt('Sem Prêmio', false, "setPremio('sem',this)").replace('class="fdd-opt', 'id="premio-opt-sem" class="fdd-opt') +
      '<button class="fdd-clear" onclick="clearPremio()"><span>Limpar filtros</span>' + TRASH_SVG + '</button>';
    return dropdown('Prêmio', 'premio-val', opts).replace('id="premio-val">Todos', 'id="premio-val">Com Prêmio').replace('<div class="fdd">', '<div class="fdd" id="premio-row">');
  }

  function sortDropdownHtml() {
    var opts = ddOpt('Numeração', true, "setSortOpt('num-asc',this)").replace('class="fdd-opt', 'id="sort-opt-num-asc" class="fdd-opt') +
      ddOpt('Menor preço', false, "setSortOpt('venda-asc',this)").replace('class="fdd-opt', 'id="sort-opt-venda-asc" class="fdd-opt') +
      ddOpt('Maior preço', false, "setSortOpt('venda-desc',this)").replace('class="fdd-opt', 'id="sort-opt-venda-desc" class="fdd-opt');
    return dropdown('Ordenar', 'sort-val', opts).replace('id="sort-val">Todos', 'id="sort-val">Numeração') +
      '<input type="hidden" id="sort" value="num-asc">';
  }
  function placeholder(txt) {
    return '<div class="ph"><div class="ph-icon">&#128247;</div><div>Imagens em breve</div><small>' + txt + '</small></div>';
  }

  /* ---------- PLANTAS ---------- */
  function plantasHtml() {
    if (emp.plantas && emp.plantas.length) {
      var cards = emp.plantas.map(function (p) {
        return '<div class="planta-item"><div class="zoom-box"><img class="zoom-img" src="' + p.img + '" alt="' + p.title + '"><div class="zoom-hint">&#128269; Zoom</div></div>' +
          '<div class="planta-item-cap"><div class="planta-item-title">' + p.title + '</div><div class="planta-item-sub">' + (p.sub || '') + '</div></div></div>';
      }).join('');
      return '<div class="plantas-grid">' + cards + '</div>';
    }
    return placeholder('Envie as imagens das plantas deste empreendimento para exibi-las aqui.');
  }
  // cards de planta exibidos acima das unidades quando um tipo e filtrado
  function plantaDestaqueHtml() {
    if (!emp.plantas || !emp.plantas.length) return '';
    return emp.plantas.filter(function (p) { return p.tipo; }).map(function (p) {
      return '<div class="planta-card" data-tipo="' + p.tipo + '">' +
        '<p class="planta-title">' + p.title + '</p>' +
        '<p class="planta-sub">' + (p.sub || '') + '</p>' +
        '<div class="zoom-box"><img class="zoom-img" src="' + p.img + '" alt="' + p.title + '"><div class="zoom-hint">&#128269; Zoom</div></div>' +
      '</div>';
    }).join('');
  }

  /* ---------- IMPLANTACAO ---------- */
  function implantacaoHtml() {
    var img = emp.implantacao && emp.implantacao.img
      ? '<div class="zoom-box" style="border-radius:0"><img class="zoom-img" src="' + emp.implantacao.img + '" alt="Implantacao" style="background:#F5F0E8"><div class="zoom-hint">&#128269; Passe o mouse para zoom</div></div>'
      : placeholder('Envie a planta de implantação deste empreendimento.');
    var leg = (emp.implantacao && emp.implantacao.legenda && emp.implantacao.legenda.length)
      ? '<div style="padding:1.5rem 2rem .5rem"><span class="stag">Legenda</span><h3 style="font-family:Playfair Display,serif;font-size:1.2rem;margin-bottom:1rem">Itens de lazer e comodidade</h3></div>' +
        '<div class="am-grid">' + emp.implantacao.legenda.map(function (nome, i) {
          var n = (i + 1 < 10 ? '0' : '') + (i + 1);
          return '<div class="am-item"><span class="am-num">' + n + '</span><span class="am-name">' + nome + '</span></div>';
        }).join('') + '</div>'
      : '';
    return '<div class="impl-wrap">' + img + leg + '</div>';
  }

  /* ---------- GALERIA ---------- */
  function galeriaHtml() {
    var g = emp.galeria || {};
    if (g.items && g.items.length) {
      var hero = g.heroImg
        ? '<div class="gallery-hero"><img src="' + g.heroImg + '" alt="Fachada"><div class="ghc"><div class="ghc-title">' + (g.heroTitle || '') + '</div><div class="ghc-sub">' + (g.heroSub || '') + '</div></div></div>'
        : '';
      var cards = g.items.map(function (it) {
        return '<div class="g-card"><img src="' + it.img + '" alt="' + it.title + '" class="g-img"><div class="g-cap"><div class="g-cap-title">' + it.title + '</div><div class="g-cap-sub">' + (it.sub || '') + '</div></div></div>';
      }).join('');
      return hero + '<div class="g-grid">' + cards + '</div>';
    }
    return placeholder('Envie os renders/fotos da galeria deste empreendimento.');
  }

  /* ---------- VAGAS ---------- */
  function vagasHtml() {
    if (emp.vagasPdf) {
      return '<div class="impl-wrap">' +
        '<iframe class="vagas-pdf" src="' + emp.vagasPdf + '#view=FitH" title="Mapa de Vagas" loading="lazy"></iframe>' +
        '<div class="pdf-actions"><a class="pdf-link" href="' + emp.vagasPdf + '" target="_blank" rel="noopener">Abrir em nova aba &rarr;</a></div>' +
      '</div>';
    }
    if (emp.vagasImgs && emp.vagasImgs.length) {
      return '<div class="impl-wrap">' + emp.vagasImgs.map(function (src, i) {
        return '<div class="zoom-box" style="border-radius:0' + (i ? ';margin-top:1rem' : '') + '"><img class="zoom-img" src="' + src + '" alt="Mapa de Vagas ' + (i + 1) + '" style="background:#F5F0E8"><div class="zoom-hint">&#128269; Passe o mouse para zoom</div></div>';
      }).join('') + '</div>';
    }
    return emp.vagasImg
      ? '<div class="impl-wrap"><div class="zoom-box" style="border-radius:0"><img class="zoom-img" src="' + emp.vagasImg + '" alt="Mapa de Vagas" style="background:#F5F0E8"><div class="zoom-hint">&#128269; Passe o mouse para zoom</div></div></div>'
      : placeholder('Envie o mapa de vagas deste empreendimento.');
  }

  /* ---------- MONTAGEM ---------- */
  app.innerHTML =
  '<div class="hero"><div class="hero-bg" style="' + heroStyle() + '"></div><div class="hero-grad"></div>' +
    '<a class="hero-back" href="index.html">&larr; Todos os empreendimentos</a>' +
    '<div class="hero-inner">' +
      '<div class="hero-eyebrow">' + emp.eyebrow + '</div>' +
      '<h1 class="hero-title">' + emp.titleHtml + '</h1>' +
      '<p class="hero-sub">' + (emp.sub || '') + '</p>' +
      proximidadesHtml() + badgesHtml() + pillsHtml() +
    '</div></div>' +

  '<nav class="nav"><div class="nav-inner">' +
    '<button class="nav-tab active" onclick="switchTab(\'unidades\',this)">Unidades</button>' +
    '<button class="nav-tab" onclick="switchTab(\'plantas\',this)">Plantas</button>' +
    '<button class="nav-tab" onclick="switchTab(\'implantacao\',this)">Implantacao</button>' +
    '<button class="nav-tab" onclick="switchTab(\'galeria\',this)">Galeria</button>' +
    (emp.hideVagas ? '' : '<button class="nav-tab" onclick="switchTab(\'vagas\',this)">Mapa de Vagas</button>') +
    '<div class="upd">' +
      '<span class="update-status" id="update-status"></span>' +
      '<span class="last-update" id="last-update"></span>' +
      '<button class="btn-update" id="btn-update" onclick="doUpdate()">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path></svg>' +
        'Atualizar planilha</button>' +
    '</div>' +
  '</div></nav>' +

  '<div class="section active" id="tab-unidades">' +
    '<div class="filter-bar">' +
      tipoDropdownHtml() +
      (emp.hideSol ? '' : solDropdownHtml()) +
      premioDropdownHtml() +
      torreDropdownHtml() +
      sortDropdownHtml() +
      '<div class="fcount"><strong id="count-label">0</strong> unidades</div>' +
    '</div>' +
    '<div class="view-toggle">' +
      '<button class="view-btn on" id="view-btn-cards" title="Ver em cards" onclick="setView(\'cards\',this)">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>' +
      '</button>' +
      '<button class="view-btn" id="view-btn-list" title="Ver em lista" onclick="setView(\'list\',this)">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>' +
      '</button>' +
    '</div>' +
    '<div id="planta-destaque">' + plantaDestaqueHtml() + '</div>' +
    '<div class="units-grid" id="units-grid"></div>' +
  '</div>' +

  '<div class="section" id="tab-plantas">' +
    '<span class="stag">Tipologias do projeto</span>' +
    '<h2 class="stitle">Plantas dos Apartamentos</h2>' +
    '<p class="ssub">Passe o mouse sobre cada planta para dar zoom.</p>' +
    plantasHtml() +
  '</div>' +

  '<div class="section" id="tab-implantacao">' +
    '<span class="stag">Planta oficial do terreno</span>' +
    '<h2 class="stitle">Implantacao do Empreendimento</h2>' +
    '<p class="ssub">Passe o mouse para zoom.</p>' +
    implantacaoHtml() +
  '</div>' +

  '<div class="section" id="tab-galeria">' +
    '<span class="stag">Imagens do projeto</span>' +
    '<h2 class="stitle">' + emp.nome + '</h2>' +
    '<p class="ssub">Renders e perspectivas arquitetônicas. Imagens ilustrativas.</p>' +
    galeriaHtml() +
  '</div>' +

  (emp.hideVagas ? '' :
  '<div class="section" id="tab-vagas">' +
    '<h2 class="stitle">Mapa de Vagas</h2>' +
    '<p class="ssub">Localização das vagas de garagem por torre e por unidade.</p>' +
    vagasHtml() +
  '</div>');

  renderUnits();
  initZoom();
  doUpdate();

  // mede a altura real do menu de abas para o filtro grudar logo abaixo dele
  function syncNavHeight() {
    var nav = document.querySelector('.nav');
    if (nav) document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
  }
  syncNavHeight();
  window.addEventListener('resize', syncNavHeight);

  // abre/fecha os dropdowns de filtro no toque (o :hover sozinho nao e confiavel em telas touch)
  document.querySelectorAll('.fdd-btn').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var fdd = btn.parentElement;
      var wasOpen = fdd.classList.contains('open');
      document.querySelectorAll('.fdd.open').forEach(function (f) { f.classList.remove('open'); });
      if (!wasOpen) fdd.classList.add('open');
    });
  });
  document.addEventListener('click', function () {
    document.querySelectorAll('.fdd.open').forEach(function (f) { f.classList.remove('open'); });
  });
})();
</script>
