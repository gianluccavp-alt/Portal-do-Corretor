<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendências de Vendas · Senha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:#3A4043;background:#F5F6F7;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.hero{background:#FFFFFF url(../../../../assets/img/hero-bg.png) center/cover no-repeat}
.step{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#E4032B}
.step::before{content:"";width:22px;height:2px;border-radius:2px;background:#E4032B}
.lab{font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:#727A7D}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 17px;border-radius:9px;border:1px solid #E7E9EA;background:#FFFFFF;color:#3A4043;font:500 15px/1 'DM Sans',system-ui,sans-serif;cursor:pointer;transition:all .15s}
.btn-p{background:#E4032B;border-color:#E4032B;color:#FFFFFF}
.btn-p:hover{background:#B8001F;border-color:#B8001F}
.inp{width:100%;height:48px;border:1px solid #E7E9EA;border-radius:9px;background:#FFFFFF;padding:0 48px 0 42px;font:400 15px 'DM Sans',system-ui,sans-serif;color:#3A4043;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:#E4032B;box-shadow:0 0 0 3px rgba(228,3,43,.10)}
.inp::placeholder{color:#727A7D}
.eye{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:none;color:#727A7D;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}
.eye:hover{color:#E4032B}
</style>
</head>
<body>
<div class="hero" style="width: 1440px; height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; border-bottom: 1px solid #E7E9EA">
  <main style="width: 440px; background: #FFFFFF; border: 1px solid #E7E9EA; border-radius: 18px; padding: 40px 40px 36px; display: flex; flex-direction: column; gap: 26px">
    <img src="../../../../assets/img/logo-direcional-header.png" alt="Direcional" style="height: 36px; align-self: flex-start">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div class="step">Comercial · Área interna</div>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.15">Pendências de Vendas</h1>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #5E666A">Acesso restrito ao time comercial. Digite a senha para ver as vendas com pendência.</p>
    </div>
    <form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label class="lab" for="lg-senha">Senha</label>
        <div style="position: relative">
          <svg style="position: absolute; left: 14px; top: 15px; color: #727A7D; pointer-events: none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          <input class="inp" id="lg-senha" type="password" placeholder="Senha do comercial" autocomplete="current-password" enterkeyhint="go">
          <button class="eye" type="button" aria-label="Mostrar senha">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <button class="btn btn-p" type="submit" style="width: 100%">Entrar</button>
    </form>
  </main>
  <p style="margin: 0; font-size: 12.5px; color: #727A7D">Grupo Direcional · SPI Campinas e Ribeirão Preto</p>
</div>
</body>
</html>
