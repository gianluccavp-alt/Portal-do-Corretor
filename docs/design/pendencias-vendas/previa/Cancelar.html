<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendências de Vendas · Cancelar venda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:#3A4043;background:#F5F6F7;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.hero{background:#FFFFFF url(../../../../assets/img/hero-bg.png) center/cover no-repeat;border-bottom:1px solid #E7E9EA}
.step{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#E4032B}
.step::before{content:"";width:22px;height:2px;border-radius:2px;background:#E4032B}
.lab{font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:#727A7D}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 17px;border-radius:9px;border:1px solid #E7E9EA;background:#FFFFFF;color:#3A4043;font:500 14px/1 'DM Sans',system-ui,sans-serif;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#E4032B;color:#E4032B}
.btn-p{background:#E4032B;border-color:#E4032B;color:#FFFFFF}
.btn-p:hover{background:#B8001F;border-color:#B8001F;color:#FFFFFF}
.card{background:#FFFFFF;border:1px solid #E7E9EA;border-radius:14px}
.sk{background:#ECEEEF;border-radius:6px;height:12px}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #F5F6F7">
  <div aria-hidden="true">
    <div class="hero" style="position: relative; height: 196px; padding: 36px 80px">
      <img src="../../../../assets/img/logo-direcional-header.png" alt="" style="position: absolute; top: 30px; right: 80px; height: 42px">
      <div class="step">Comercial · Área interna</div>
      <div style="margin-top: 12px; font-size: 38px; font-weight: 700; letter-spacing: -0.8px">Pendências de Vendas</div>
    </div>
    <div style="padding: 28px 80px; display: flex; flex-direction: column; gap: 20px">
      <div class="card" style="height: 112px"></div>
      <div class="card" style="height: 150px"></div>
      <div class="card" style="padding: 22px; display: flex; flex-direction: column; gap: 30px">
        <div class="sk" style="width: 60%"></div>
        <div class="sk" style="width: 72%"></div>
        <div class="sk" style="width: 55%"></div>
        <div class="sk" style="width: 66%"></div>
      </div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(40,44,46,.42)"></div>

  <div role="alertdialog" aria-modal="true" aria-labelledby="cx-t" aria-describedby="cx-d" style="position: absolute; left: 470px; top: 250px; width: 500px; background: #FFFFFF; border: 1px solid #E7E9EA; border-radius: 18px; box-shadow: 0 24px 60px rgba(28,32,34,.22); padding: 28px; display: flex; flex-direction: column; gap: 18px">
    <div style="width: 44px; height: 44px; border-radius: 12px; background: #FDEEF0; color: #C4001C; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="m5.7 5.7 12.6 12.6"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="cx-t" style="margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.3px">Cancelar esta venda?</h2>
      <p id="cx-d" style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #5E666A">A linha fica vermelha e tachada no RELATÓRIO e a venda sai da lista de pendências. Dá para reativar depois ligando “Mostrar canceladas”.</p>
    </div>
    <div style="background: #FAFBFB; border: 1px solid #E7E9EA; border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <div>
        <div style="font-size: 14px; font-weight: 700">Mariana Alves Pereira</div>
        <div class="num" style="font-size: 12.5px; color: #727A7D; margin-top: 2px">OP-006812044 · Village Gaia · BL02-0104</div>
      </div>
      <span class="num" style="font-size: 14px; font-weight: 500">R$ 214.900</span>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 4px">
      <button class="btn" type="button">Voltar</button>
      <button class="btn btn-p" type="button">Cancelar venda</button>
    </div>
  </div>
</div>
</body>
</html>
