<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Match de Unidades · desktop, pergunta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F7}
.dk,.dk *{box-sizing:border-box}
:where(.dk) button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;margin:0;text-align:left}
.dk :focus-visible{outline:2px solid #E4032B;outline-offset:3px;border-radius:12px}
.btn-pri{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 28px;border-radius:18px;background:#E4032B;color:#fff;font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 12px 24px -10px rgba(228,3,43,.65);transition:transform .12s,background .2s}
.btn-pri:hover{background:#CF0227}
.btn-pri:active{transform:scale(.97)}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 20px;border-radius:18px;font-weight:600;font-size:15px;color:#5C6467}
.btn-ghost:hover{background:#fff;color:#2B3033}
.tl{display:grid;grid-template-columns:24px minmax(0,1fr) auto;column-gap:14px;width:100%;border-radius:14px;padding:0 8px;transition:background .2s}
.tl:hover{background:#F5F6F7}
.tl:hover .ed{color:#E4032B}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:200px;padding:20px;border-radius:24px;background:#fff;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(58,64,67,.06),0 14px 30px -20px rgba(58,64,67,.35);transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-3px)}
.tile-on{border-color:#E4032B;background:#FFF6F7;box-shadow:0 18px 34px -20px rgba(228,3,43,.5)}
.sw{width:48px;height:28px;border-radius:99px;background:#D9DEE1;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw-on{background:#E4032B}
.sw-on::after{transform:translateX(20px)}
.float{animation:float 4.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.now{position:relative}
.now::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid #E4032B;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.35);opacity:0}}
kbd{font:inherit;font-size:12px;font-weight:700;padding:3px 7px;border-radius:7px;background:#fff;border:1px solid #E7E9EA;box-shadow:0 1px 0 #E7E9EA}
@media (prefers-reduced-motion:reduce){.dk *,.dk *::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="dk" style="width: 100%; min-height: 900px; background: #F5F6F7; font-family: 'DM Sans', system-ui, sans-serif; color: #3A4043">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E7E9EA">
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <a href="#" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: #3A4043">
        <img src="/_blob/783a2ce2071658b66324613cff84af88" alt="Grupo Direcional" style="height: 26px; width: auto; display: block">
        <span style="width: 1px; height: 24px; background: #E7E9EA"></span>
        <span style="font-size: 15px; font-weight: 700">Portal do Corretor</span>
      </a>
      <div style="display: flex; align-items: center; gap: 16px">        <button type="button" aria-label="Sair do Match" style="width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: #F5F6F7"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </div>
    <div style="height: 3px; background: #F0F2F3"><div style="width: 66%; height: 100%; background: #E4032B"></div></div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 40px 32px 48px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <aside style="flex: 1 1 300px; max-width: 360px; background: #FFFFFF; border-radius: 28px; padding: 26px 18px 18px; box-shadow: 0 1px 2px rgba(58,64,67,.06), 0 20px 40px -30px rgba(58,64,67,.4)">
      <div style="padding: 0 8px">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #E4032B">Match de Unidades</div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px">
          <h2 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.4px; color: #2B3033">Atendimento</h2>
          <span style="font-size: 13px; font-weight: 600; color: #727A7D">5 de 6</span>
        </div>
      </div>
      <div style="margin-top: 18px">
        <sc-for list="{{feitos}}" as="f" hint-placeholder-count="4">
          <button type="button" class="tl" aria-label="Editar {{f.rot}}">
            <span style="display: flex; flex-direction: column; align-items: center">
              <span style="width: 22px; height: 22px; border-radius: 50%; background: #E4032B; display: grid; place-items: center; margin-top: 14px; flex: none; box-shadow: 0 3px 8px -2px rgba(228,3,43,.55)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
              <span style="flex: 1; width: 2px; background: #E4032B; opacity: .3; margin-top: 3px; min-height: 12px"></span>
            </span>
            <span style="display: flex; flex-direction: column; padding: 11px 0 12px; min-width: 0">
              <span style="font-size: 12px; color: #727A7D">{{f.rot}}</span>
              <span style="font-size: 15px; font-weight: 600; color: #2B3033">{{f.val}}</span>
            </span>
            <span class="ed" style="align-self: center; font-size: 13px; font-weight: 600; color: #A3AAAD">Editar</span>
          </button>
        </sc-for>
        <div class="tl" style="background: #FFF6F7">
          <span style="display: flex; flex-direction: column; align-items: center">
            <span class="now" style="width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 6px solid #E4032B; margin-top: 14px; flex: none"></span>
            <span style="flex: 1; width: 0; border-left: 2px dashed #D3D8DB; margin-top: 6px; min-height: 12px"></span>
          </span>
          <span style="display: flex; flex-direction: column; padding: 11px 0 12px">
            <span style="font-size: 12px; color: #E4032B; font-weight: 700">Agora</span>
            <span style="font-size: 15px; font-weight: 700; color: #2B3033">Perfil do cliente</span>
          </span>
          <span></span>
        </div>
        <sc-for list="{{futuros}}" as="u" hint-placeholder-count="2">
          <div class="tl" style="height: 46px">
            <span style="display: flex; flex-direction: column; align-items: center">
              <span style="width: 12px; height: 12px; border-radius: 50%; border: 2px solid #C9CFD2; margin-top: 15px; flex: none"></span>
              <span style="flex: 1; width: 0; border-left: 2px dashed #D3D8DB; margin-top: 4px; opacity: {{u.linha}}"></span>
            </span>
            <span style="font-size: 15px; color: #A3AAAD; font-weight: 500; padding-top: 11px">{{u.rot}}</span>
            <span></span>
          </div>
        </sc-for>
      </div>
    </aside>

    <section style="flex: 999 1 560px; min-width: 0; padding-top: 8px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap">
        <div style="max-width: 620px">
          <div style="font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #E4032B">Passo 5 · Perfil do cliente</div>
          <h1 style="margin: 10px 0 0; font-size: 48px; line-height: 1.05; font-weight: 800; letter-spacing: -1.6px; color: #2B3033">O que vale para o cliente?</h1>
          <p style="margin: 14px 0 0; font-size: 17px; line-height: 1.5; color: #5C6467">Essas quatro respostas mudam o enquadramento e o subsídio. Clique para ligar ou desligar.</p>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 32px">
        <button type="button" role="switch" aria-checked="true" class="tile tile-on">
          <span style="display: flex; justify-content: space-between; align-items: flex-start"><span class="float"><dc-import name="Icone" icone="maleta" tamanho="76" hint-size="76px,76px"></dc-import></span><span class="sw sw-on"></span></span>
          <span><span style="display: block; font-size: 17px; font-weight: 700; color: #2B3033">3 anos de FGTS</span><span style="display: block; font-size: 13px; color: #727A7D; margin-top: 4px">Somando todos os períodos</span></span>
        </button>
        <button type="button" role="switch" aria-checked="false" class="tile">
          <span style="display: flex; justify-content: space-between; align-items: flex-start"><span class="float" style="animation-delay: -1.1s"><dc-import name="Icone" icone="chave" tamanho="76" hint-size="76px,76px"></dc-import></span><span class="sw"></span></span>
          <span><span style="display: block; font-size: 17px; font-weight: 700; color: #2B3033">Possui imóvel na cidade</span><span style="display: block; font-size: 13px; color: #727A7D; margin-top: 4px">Residencial, em nome do cliente</span></span>
        </button>
        <button type="button" role="switch" aria-checked="true" class="tile tile-on">
          <span style="display: flex; justify-content: space-between; align-items: flex-start"><span class="float" style="animation-delay: -2.2s"><dc-import name="Icone" icone="pessoas" tamanho="76" hint-size="76px,76px"></dc-import></span><span class="sw sw-on"></span></span>
          <span><span style="display: block; font-size: 17px; font-weight: 700; color: #2B3033">Mais de um comprador ou dependente</span><span style="display: block; font-size: 13px; color: #727A7D; margin-top: 4px">Sem dependente, só 30% do subsídio</span></span>
        </button>
        <button type="button" role="switch" aria-checked="false" class="tile">
          <span style="display: flex; justify-content: space-between; align-items: flex-start"><span class="float" style="animation-delay: -3.3s"><dc-import name="Icone" icone="presente" tamanho="76" hint-size="76px,76px"></dc-import></span><span class="sw"></span></span>
          <span><span style="display: block; font-size: 17px; font-weight: 700; color: #2B3033">Já recebeu subsídio FGTS/União</span><span style="display: block; font-size: 13px; color: #727A7D; margin-top: 4px">Em qualquer financiamento anterior</span></span>
        </button>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 40px; padding-top: 24px; border-top: 1px solid #E7E9EA">
        <button type="button" class="btn-ghost"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Voltar</button>
        <div style="display: flex; align-items: center; gap: 18px; flex-wrap: wrap">
          <span style="font-size: 13px; color: #727A7D">Pressione <kbd>Enter</kbd> para continuar</span>
          <button type="button" class="btn-pri">Continuar<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      feitos: [
        { rot: 'Onde', val: 'Village Park · Ribeirão Preto' },
        { rot: 'Renda bruta', val: 'R$ 4.200/mês' },
        { rot: 'Ato', val: 'R$ 5.000' },
        { rot: 'Nascimento', val: '14/03/1993 · 33 anos' }
      ],
      futuros: [{ rot: 'Política', linha: '1' }, { rot: 'Resultado', linha: '0' }]
    };
  }
}
</script>
</body>
</html>
