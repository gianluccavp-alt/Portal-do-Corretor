class Component extends DCLogic {
  renderVals() {
    const i = this.props.icone || 'casa';
    const t = Number(this.props.tamanho) || 160;
    const rotulos = { casa: 'Casa', pino: 'Localização', carteira: 'Carteira', moedas: 'Moedas', calendario: 'Calendário', maleta: 'Maleta', chave: 'Chave', pessoas: 'Pessoas', presente: 'Presente', medalha: 'Medalha', alvo: 'Alvo', predio: 'Prédio' };
    return {
      px: t + 'px',
      rotulo: rotulos[i] || 'Ícone',
      casa: i === 'casa', pino: i === 'pino', carteira: i === 'carteira', moedas: i === 'moedas',
      calendario: i === 'calendario', maleta: i === 'maleta', chave: i === 'chave', pessoas: i === 'pessoas',
      presente: i === 'presente', medalha: i === 'medalha', alvo: i === 'alvo', predio: i === 'predio'
    };
  }
}
